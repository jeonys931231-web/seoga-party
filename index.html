<style>
:root{
  --stage:#1b1f5e;        /* 무대 남색 */
  --stage-deep:#12153f;
  --stage-hi:#2d3290;
  --caption:#ffe14d;      /* 예능 자막 노랑 */

  --ui:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;min-height:100%;background:var(--stage)}
body{color:var(--text);font-family:var(--ui);font-size:20px;line-height:1.45;word-break:keep-all;overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}

#app{position:relative;z-index:1}

input,textarea,select{font:inherit}
:focus-visible{outline:4px solid var(--caption);outline-offset:3px}
[hidden]{display:none!important}

.scr{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.wrap{width:100%;max-width:880px;margin:0 auto;padding:0 var(--gut)}

/* ---------- 예능 자막 글씨 ---------- */
.cap{font-family:var(--display);font-weight:400;color:var(--caption);letter-spacing:.01em;
  text-shadow:
    .055em 0 0 var(--ink), -.055em 0 0 var(--ink), 0 .055em 0 var(--ink), 0 -.055em 0 var(--ink),
    .039em .039em 0 var(--ink), -.039em .039em 0 var(--ink), .039em -.039em 0 var(--ink), -.039em -.039em 0 var(--ink),
    .05em .022em 0 var(--ink), -.05em .022em 0 var(--ink), .05em -.022em 0 var(--ink), -.05em -.022em 0 var(--ink),
    .022em .05em 0 var(--ink), -.022em .05em 0 var(--ink), .022em -.05em 0 var(--ink), -.022em -.05em 0 var(--ink),

/* ---------- 공통 버튼 ---------- */

.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.btn small{font-family:var(--ui);font-size:16px;margin-top:3px;opacity:.85}
.btn-main{background:var(--caption);color:var(--ink)}
.btn-sub{background:var(--card);color:var(--ink)}
.btn-go{background:var(--ok);color:var(--ink);font-size:44px;min-height:100px}
.btn-sm{background:transparent;border:3px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 16px;font-size:17px;min-height:46px;white-space:nowrap}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px var(--gut)}

.bar-dim{display:block;font-family:var(--ui);font-size:15px;color:var(--muted)}
.bar-gap{width:92px;flex:none}

.foot{position:sticky;bottom:0;z-index:2;margin-top:auto;padding:16px var(--gut) calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(27,31,94,0), var(--stage) 28%)}
.foot>.btn{max-width:560px;margin:0 auto}

.foot-two>.btn{max-width:560px}
@media (min-width:700px){.foot-two{grid-template-columns:1fr 1fr;max-width:900px;width:100%;margin-left:auto;margin-right:auto}.foot-two>.btn{max-width:none}}

/* ---------- 처음 화면 (게임 고르기) ---------- */
.hub{align-items:center;gap:22px;padding:30px var(--gut) calc(30px + env(safe-area-inset-bottom))}

.home-sub{position:relative;z-index:2;display:inline-block;max-width:100%;margin:0;padding:6px 22px;background:var(--alert);color:#fff;
  border:4px solid var(--ink);border-radius:999px;box-shadow:0 5px 0 var(--ink);font-family:var(--display);font-size:clamp(18px,4.6vw,26px);transform:rotate(-2deg)}
.home-title{position:relative;z-index:2;margin:14px 0 0;font-size:clamp(56px,13.5vw,124px);line-height:1.1;word-break:keep-all}
.teams-strip{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 12px;padding:4px;background:none;border:0;border-radius:24px}
.team-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 18px;border:4px solid var(--ink);border-radius:999px;background:var(--tc);

.team-chip small{font-family:var(--ui);font-size:15px;opacity:.8}

  background:var(--card);color:var(--ink);border:5px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);text-align:center;transition:transform .06s,box-shadow .06s}

.game-name{font-family:var(--display);font-size:clamp(25px,6.4vw,30px);line-height:1.15}

.game-badge{position:absolute;top:-15px;left:50%;transform:translateX(-50%) rotate(-3deg);padding:1px 12px;border:3px solid var(--ink);border-radius:999px;
  background:var(--ok);font-family:var(--display);font-size:15px;white-space:nowrap}
.hub-resume{max-width:460px}
.hub-tools{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:460px}
.hub-tools .btn{font-size:22px;min-height:60px;padding:8px 10px}
.home-foot{margin:0;color:var(--muted);font-size:17px;text-align:center}
.badge{display:inline-block;margin-top:8px;padding:4px 14px;border-radius:999px;background:rgba(255,225,77,.14);color:var(--caption);font-size:15px}

/* ---------- 이기는 방법 카드 ---------- */
.modal.guide{display:flex;flex-direction:column;max-width:660px;max-height:92vh;padding:0;overflow:hidden;text-align:left}

/* ---------- 패널 (준비·편집) ---------- */
.panel{background:var(--stage-deep);border:3px solid var(--stage-hi);border-radius:22px;padding:18px;margin:0 0 16px}
.panel-title{margin:0 0 10px;font-family:var(--display);font-weight:400;font-size:24px;color:var(--caption)}

/* ---------- 큐카드 ---------- */
.cue{background:var(--card);color:var(--ink);border:6px solid var(--ink);border-radius:28px;box-shadow:0 10px 0 var(--ink)}

/* ---------- 준비 화면 ---------- */
.ready-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:4px var(--gut) 8px;text-align:center}

/* ---------- 게임 화면 ---------- */
.play{height:100vh;height:100dvh;min-height:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto auto minmax(0,1fr) auto auto;grid-template-areas:"top" "bar" "mid" "tools" "btns";

function calcTurnScore(tr) {
  if (!tr) return 0;
  const ok = tr.log.filter(x => x.r === 'ok').length;
  const pass = tr.log.filter(x => x.r === 'pass').length;
  return ok * tr.cat.points - (S.game && S.game.rules.passPenalty ? pass : 0);
}

/* ---------- 소리 ---------- */
const Sound = {
  ctx: null, out: null,
  unlock() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        const comp = this.ctx.createDynamicsCompressor();
        this.out = this.ctx.createGain();
        this.out.gain.value = 0.9;
        this.out.connect(comp);
        comp.connect(this.ctx.destination);
        try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) {}
  },
  note(f, at, dur, o = {}) {
    const c = this.ctx, t = c.currentTime + at;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'triangle';
    osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.3, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g);
    g.connect(this.out);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  },
  play(name) {
    if (!this.ctx || !S.settings.sound) return;
    try {
      const n = (...a) => this.note(...a);
      switch (name) {
        case 'ok': n(523.25, 0, .2); n(659.25, .09, .2); n(783.99, .18, .2); n(1046.5, .27, .45, { vol: .34 }); break;
        case 'pass': n(740, 0, .2, { type: 'square', vol: .1, to: 260 }); break;
        case 'deny': n(160, 0, .18, { type: 'square', vol: .12 }); break;
        case 'tick': n(1250, 0, .07, { type: 'square', vol: .09 }); break;
        case 'roll': n(880 + Math.random() * 320, 0, .05, { type: 'square', vol: .05 }); break;
        case 'count': n(659.25, 0, .22, { vol: .32 }); break;
        case 'go': n(1046.5, 0, .45, { vol: .32 }); n(1318.5, 0, .45, { vol: .2 }); break;
        case 'end': n(196, 0, .9, { type: 'sawtooth', vol: .16 }); n(207.65, 0, .9, { type: 'sawtooth', vol: .12 }); break;
        case 'fanfare':
          [[523.25, 0], [659.25, .13], [783.99, .26], [1046.5, .39], [783.99, .62], [1046.5, .75]]
            .forEach(([f, t], i) => n(f, t, i === 5 ? .9 : .18, { vol: .3 }));
          break;
      }
    } catch (e) {}
  }
};

let wake = null;
async function keepAwake() {
  try {
    if ('wakeLock' in navigator && !wake && !document.hidden) {
      wake = await navigator.wakeLock.request('screen');
      wake.addEventListener && wake.addEventListener('release', () => { wake = null; });
    }
  } catch (e) { wake = null; }
}
function releaseWake() { try { wake && wake.release(); } catch (e) {} wake = null; }
const fsSupported = () => !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);

/* ---------- 작은 UI ---------- */
let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('is-on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('is-on'), 2000);
}
function overlay(html, cls = '') {
  const ov = $('#overlay');
  ov.className = ('is-open ' + cls).trim();
  ov.innerHTML = html;
  if (cls !== 'ov-plain') {
    const f = ov.querySelector('button');
    if (f) try { f.focus({ preventScroll: true }); } catch (e) {}
  }
}
function closeOverlay() { const ov = $('#overlay'); ov.className = ''; ov.innerHTML = ''; }
const overlayOpen = () => $('#overlay').classList.contains('is-open');
let askResolve = null;
function ask(text, yes = '네', no = '아니요') {
  return new Promise(res => {
    askResolve = res;
    overlay(`<div class="modal" role="dialog" aria-modal="true">
      <p class="modal-text">${esc(text)}</p>
      <div class="modal-btns row">
        <button class="btn btn-sub" data-act="askNo">${esc(no)}</button>
        <button class="btn btn-main" data-act="askYes">${esc(yes)}</button>
      </div></div>`);
  });
}

function guideHtml(g) {
  const line = t => {
    const k = t.indexOf('|');
    return k < 0 ? esc(t) : `<span class="guide-row"><b>${esc(t.slice(0, k).trim())}</b><span>${esc(t.slice(k + 1).trim())}</span></span>`;
  };
  // 표처럼 보이는 줄은 왼쪽 칸 너비를 그 묶음에서 가장 긴 글자에 맞춰요
  const labelW = items => {
    const ls = items.filter(t => t.includes('|')).map(t => t.slice(0, t.indexOf('|')).trim().length);
    return ls.length ? Math.round(Math.min(6.4, Math.max(2.2, Math.max(...ls) * 0.95 + 0.4)) * 21) : 0;
  };
  return `<div class="modal guide" role="dialog" aria-modal="true" aria-label="${esc(g.name)} 이기는 방법">
    <div class="guide-body">
      <div class="guide-head"><span class="guide-ico" aria-hidden="true">${iconHtml(g)}</span><h3 class="guide-name cap">${esc(g.name)}</h3></div>
      ${g.win ? `<div class="cue guide-win">

      </div>` : ''}
      ${g.sections.map(s => {
        const tag = s.steps ? 'ol' : 'ul', w = labelW(s.items);
        return `<section class="guide-sec">${s.title ? `<h4>${esc(s.title)}</h4>` : ''}
          <${tag} class="guide-list${s.steps ? ' steps' : ''}"${w ? ` style="--lw:${w}px"` : ''}>${s.items.map(t => `<li>${line(t)}</li>`).join('')}</${tag}></section>`;
      }).join('')}
      ${g.note ? `<p class="guide-note">${esc(g.note)}</p>` : ''}
    </div>
    <div class="guide-foot${g.playInApp ? ' two' : ''}">

  </div>`;
}

const VIEWS = { home: viewHome, settings: viewSettings, setup: viewSetup, board: viewBoard, ready: viewReady, play: viewPlay, result: viewResult, final: viewFinal, editor: viewEditor };

function render() {
  if (['board', 'ready', 'play', 'result', 'final'].includes(S.screen) && !S.game) S.screen = 'home';
  if ((S.screen === 'play' || S.screen === 'result') && !S.turn) S.screen = 'board';
  if (S.screen === 'ready' && !getCat(S.pendingCat)) S.screen = 'board';
  if (wordBoxObserver) { wordBoxObserver.disconnect(); wordBoxObserver = null; }
  $('#app').innerHTML = (VIEWS[S.screen] || viewHome)();
  document.body.dataset.screen = S.screen;
  document.title = S.data.title.trim() || '온 가족 오락 대잔치';
  if (S.screen === 'play') { updatePlay(false); watchWordBox(); }
  if (S.screen === 'ready') preloadCat(getCat(S.pendingCat));
  if (S.screen === 'final' && !S.celebrated) {
    S.celebrated = true;
    setTimeout(() => { Sound.play('fanfare'); confetti(); }, 300);
  }
}
function go(screen) { S.screen = screen; render(); window.scrollTo(0, 0); }

/* ---------- 게임 진행 ---------- */
let clockId = null;
function startClock() {
  const tr = S.turn;
  if (!tr || tr.ended) return;
  tr.running = true;
  tr.lastTick = performance.now();
  clearInterval(clockId);
  clockId = setInterval(tick, 50);
}
function stopClock() { if (S.turn) S.turn.running = false; clearInterval(clockId); clockId = null; }
function tick() {
  const tr = S.turn;
  if (!tr || !tr.running) return;
  const now = performance.now();
  tr.remaining -= now - tr.lastTick;
  tr.lastTick = now;
  if (tr.remaining <= 0) { tr.remaining = 0; updateTimer(); endTurn('time'); return; }
  updateTimer();
}
function updateTimer() {
  const tr = S.turn;
  if (!tr) return;
  const sec = Math.ceil(tr.remaining / 1000);
  const el = $('#timer'), bar = $('#timebar');
  if (sec !== tr.lastSec) {
    if (el) el.textContent = sec;
    if (tr.running && sec <= 5 && sec > 0) Sound.play('tick');
    tr.lastSec = sec;
  }
  const hurry = sec <= 10;
  if (el) el.classList.toggle('is-hurry', hurry);
  if (bar) {
    bar.style.transform = `scaleX(${Math.max(0, tr.remaining / tr.total)})`;
    bar.classList.toggle('is-hurry', hurry);
  }
}

/* 정답 글자 크기: 상자 안에 다 들어가는 가장 큰 크기를 이분 탐색으로 찾아요 */
function fitWord() {
  const box = $('#wordbox'), el = $('#word');
  if (!box || !el || !el.textContent) return;
  const W = box.clientWidth - 8, H = box.clientHeight - 8;   // 글자 획이 삐져나올 여유 4px씩
  if (W < 20 || H < 20) return;
  el.style.maxWidth = W + 'px';   // 여러 줄로 나뉠 때도 이 너비 안에서 줄바꿈
  const fits = s => {
    el.style.fontSize = s + 'px';
    return el.scrollWidth <= W && el.offsetHeight <= H;
  };
  let lo = 14, hi = Math.floor(H) + 1;
  if (fits(lo)) {
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      if (fits(mid)) lo = mid; else hi = mid;
    }
  }
  el.style.fontSize = lo + 'px';
}

/* 구글 글꼴은 글자 묶음별로 나중에 내려와서, 그때 크기가 바뀌지 않게 미리 받아두고 다시 맞춰요 */
const WORD_FONT = '400 100px "Black Han Sans"', HINT_FONT = '400 20px "Jua"';
function loadFontsFor(text, font = WORD_FONT) {
  try {
    if (!text || !document.fonts || !document.fonts.load) return Promise.resolve([]);
    return document.fonts.load(font, text).catch(() => []);
  } catch (e) { return Promise.resolve([]); }
}
function preloadCat(cat) {
  if (!cat) return;
  const ws = parseWords(cat.words);
  loadFontsFor(ws.map(x => x.w).join(' ') + ' ' + catName(cat));
  loadFontsFor(ws.map(x => x.h).join(' '), HINT_FONT);
}
let wordBoxObserver = null;
function watchWordBox() {
  if (wordBoxObserver) { wordBoxObserver.disconnect(); wordBoxObserver = null; }
  const box = $('#wordbox');
  if (!box || typeof ResizeObserver === 'undefined') return;
  let last = '';
  wordBoxObserver = new ResizeObserver(() => {
    const k = box.clientWidth + 'x' + box.clientHeight;
    if (k === last) return;
    last = k;
    requestAnimationFrame(fitWord);
  });
  wordBoxObserver.observe(box);
}

function updatePlay(isNew) {
  const tr = S.turn, g = S.game;
  if (!tr || S.screen !== 'play') return;
  const wordEl = $('#word'), hintEl = $('#hint');
  wordEl.textContent = tr.current ? tr.current.w : '';
  if (isNew && !reduceMotion()) { wordEl.classList.remove('is-new'); void wordEl.offsetWidth; wordEl.classList.add('is-new'); }
  const hint = g.rules.showHint && tr.current && tr.current.h ? tr.current.h : '';
  hintEl.textContent = hint;
  hintEl.hidden = !hint;
  const ok = tr.log.filter(x => x.r === 'ok').length, ps = tr.log.filter(x => x.r === 'pass').length;
  $('#turnScore').textContent = calcTurnScore(tr);
  $('#tally').textContent = `맞힘 ${ok}개, 패스 ${ps}개`;
  const pl = tr.passesLeft;
  $('#passLeft').textContent = pl < 0 ? '마음껏' : g.rules.passes === 0 ? '이번 판은 없어요' : pl === 0 ? '다 썼어요' : `남은 ${pl}번`;
  $('#passBtn').disabled = pl === 0;
  $('#undoBtn').disabled = !tr.undo.length;
  fitWord();
  updateTimer();
  const w = tr.current && tr.current.w;
  if (w) loadFontsFor(w).then(() => { if (S.screen === 'play' && S.turn && S.turn.current && S.turn.current.w === w) fitWord(); });
}

function startTurn() {
  const g = S.game, cat = getCat(S.pendingCat);
  if (!g || !cat) { go('board'); return; }
  const all = parseWords(cat.words);
  if (!all.length) { toast('이 주제에는 문제가 없어요'); go('board'); return; }
  const used = new Set(g.usedWords[cat.id] || []);
  let pool = all.filter(x => !used.has(x.w));
  if (!pool.length) { pool = all.slice(); g.usedWords[cat.id] = []; }
  shuffle(pool);
  const total = g.rules.time * 1000;
  S.turn = {
    catId: cat.id, cat: { name: catName(cat), emoji: cat.emoji, points: cat.points },
    pool, current: pool.shift(), log: [], passesLeft: g.rules.passes,
    total, remaining: total, running: false, ended: false, undo: [], lastSec: null, lastTick: 0
  };
  go('play');
  startClock();
  keepAwake();
  if (document.hidden) ACT.pause();
}

let lastActAt = 0;
function canAct() {
  const tr = S.turn;
  if (!tr || !tr.running || tr.ended || !tr.current || overlayOpen()) return false;
  const now = performance.now();
  if (now - lastActAt < 220) return false;
  lastActAt = now;
  return true;
}
function snapshot() {
  const tr = S.turn;
  tr.undo.push({ pool: tr.pool.slice(), current: tr.current, log: tr.log.map(x => ({ ...x })), passesLeft: tr.passesLeft });
  if (tr.undo.length > 60) tr.undo.shift();
}
function feedback(kind) {
  const cue = $('#cue'), st = $('#stamp');
  if (cue) { cue.classList.remove('flash-ok', 'flash-pass'); void cue.offsetWidth; cue.classList.add('flash-' + kind); }
  if (st) { st.className = 'stamp stamp-' + kind; st.textContent = kind === 'ok' ? '정답!' : '패스'; void st.offsetWidth; st.classList.add('is-on'); }
}
function advance() {
  const tr = S.turn;
  tr.current = tr.pool.shift() || null;
  if (!tr.current) { endTurn('empty'); return; }
  updatePlay(true);
}

function endTurn(reason) {
  const tr = S.turn;
  if (!tr || tr.ended) return;
  tr.ended = true;
  stopClock();
  if (tr.current && !tr.log.find(x => x.w === tr.current.w)) tr.log.push({ w: tr.current.w, h: tr.current.h, r: 'miss' });
  tr.log.forEach(x => { x.orig = x.r; });
  const g = S.game, used = g.usedWords[tr.catId] || (g.usedWords[tr.catId] = []);
  tr.log.forEach(x => { if (!used.includes(x.w)) used.push(x.w); });
  Sound.play(reason === 'empty' ? 'fanfare' : 'end');
  buzz([80, 60, 80]);
  const msg = reason === 'time' ? '시간 끝!' : reason === 'empty' ? '문제를 다 풀었어요!' : '여기까지!';
  overlay(`<div class="timeup cap">${msg}</div>`, 'ov-plain');
  setTimeout(() => { closeOverlay(); go('result'); }, 1500);
}

function beginCountdown() {
  if (S.counting) return;
  S.counting = true;
  let n = 3;
  overlay('<div class="count cap tick" id="countNum">3</div>', 'ov-plain');
  Sound.play('count');
  const iv = setInterval(() => {
    n--;
    const el = $('#countNum');
    if (n > 0) {
      if (el) { el.textContent = n; el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick'); }
      Sound.play('count');
    } else {
      clearInterval(iv);
      closeOverlay();
      S.counting = false;
      Sound.play('go');
      startTurn();
    }
  }, 800);
}

function confetti() {
  if (reduceMotion()) return;
  const cv = $('#confetti'), ctx = cv.getContext && cv.getContext('2d');
  if (!ctx) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr;
  cv.style.display = 'block';
  const colors = ['#ffe14d', '#ff5a6e', '#3d9bff', '#34d399', '#b47cff', '#ff85c8', '#fff8e7'];
  const parts = Array.from({ length: 170 }, () => ({
    x: Math.random() * W, y: -Math.random() * H * 0.6,
    w: (6 + Math.random() * 8) * dpr, h: (10 + Math.random() * 10) * dpr,
    vx: (Math.random() - 0.5) * 3 * dpr, vy: (2 + Math.random() * 4) * dpr,
    r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3,
    c: colors[Math.floor(Math.random() * colors.length)]
  }));
  const t0 = performance.now();
  (function frame(now) {
    ctx.clearRect(0, 0, W, H);
    parts.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.05 * dpr; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (now - t0 < 5000 && S.screen === 'final') requestAnimationFrame(frame);
    else { ctx.clearRect(0, 0, W, H); cv.style.display = 'none'; }
  })(t0);
}

function generateCode() {
  const d = S.data;
  const q = s => JSON.stringify(String(s ?? ''));
  const tl = s => '`\n' + String(s ?? '').replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$\{/g, '\\${').trim() + '\n`';
  const cats = d.categories.map(c => `    {
      emoji: ${q(c.emoji)}, name: ${q(c.name)}, points: ${c.points}, enabled: ${c.enabled},
      rule: ${q(c.rule)},
      words: ${tl(c.words)}
    }`).join(',\n');
  const code = `const DEFAULT_DATA = {
  subtitle: ${q(d.subtitle)},
  title: ${q(d.title)},
  categories: [
${cats}
  ]
};`;
  return code.replace(/<\/(script)/gi, '<\\/$1');
}

/* ---------- 버튼 동작 ---------- */
function syncGameTeams() {
  const g = S.game;
  if (!g || g.finished || g.teams.length !== S.settings.teams.length) return;
  S.settings.teams.forEach((t, i) => {
    const gt = g.teams[i];
    gt.name = teamLabel(t);
    gt.members = t.members.trim();
    gt.color = t.color;
  });
  saveGame();
}

const ACT = {
  toHome() { releaseWake(); go('home'); },
  toSetup() { go('setup'); },
  openGuide(el) { const g = GUIDES[+el.dataset.i]; if (g) overlay(guideHtml(g)); },
  playQuiz() { closeOverlay(); go('setup'); },
  toSettings() { if (S.screen !== 'settings') S.backTo = S.screen; go('settings'); },
  settingsDone() { const b = S.backTo; S.backTo = null; go(b && VIEWS[b] && b !== 'settings' ? b : 'home'); },
  toEditor() { S.saveMsg = ''; go('editor'); },
  toBoard() { go('board'); },
  resume() { if (!S.game) return; keepAwake(); go('board'); },
  closeOv() { closeOverlay(); },
  askYes() { closeOverlay(); const r = askResolve; askResolve = null; r && r(true); },
  askNo() { closeOverlay(); const r = askResolve; askResolve = null; r && r(false); },

  /* 준비 */
  addTeam() { const s = S.settings; if (s.teams.length >= 6) return; s.teams.push(newTeam(s.teams)); saveSettings(); render(); },
  removeTeam(el) { const s = S.settings; if (s.teams.length <= 2) return; s.teams.splice(+el.dataset.i, 1); saveSettings(); render(); },
  cycleColor(el) {
    const t = S.settings.teams[+el.dataset.i];
    if (!t) return;
    const oldName = TEAM_PALETTE[t.color].name;
    t.color = (t.color + 1) % TEAM_PALETTE.length;
    if (!t.name.trim() || t.name === oldName) t.name = TEAM_PALETTE[t.color].name;
    saveSettings(); syncGameTeams(); render();
  },
  setOpt(el) { S.settings[el.dataset.k] = Number(el.dataset.v); saveSettings(); render(); },
  toggleOpt(el) { const k = el.dataset.k; S.settings[k] = !S.settings[k]; saveSettings(); render(); },
  startGame() {
    const s = S.settings;
    S.game = {
      id: Date.now(),
      teams: s.teams.map(t => ({ name: teamLabel(t), members: t.members.trim(), color: t.color, score: 0 })),
      rules: { time: s.time, passes: s.passes, passRequeue: s.passRequeue, passPenalty: s.passPenalty, rounds: s.rounds, showHint: s.showHint },
      turnIndex: 0,
      usedWords: S.game ? S.game.usedWords : {},
      usedCats: {}, history: [], finished: false
    };
    S.turn = null;
    saveGame(); keepAwake(); go('board');
  },

  /* 점수판 */
  menu() {
    overlay(`<div class="modal" role="dialog" aria-modal="true" aria-label="메뉴">
      <h3 class="modal-title">메뉴</h3>
      <div class="modal-btns">
        <button class="btn btn-main" data-act="closeOv">게임 계속하기</button>
        <button class="btn btn-sub" data-act="finishNow">여기서 끝내고 결과 보기</button>
        <button class="btn btn-sub" data-act="homeKeep">처음 화면으로<small>게임은 저장돼서 이어할 수 있어요</small></button>
      </div></div>`);
  },
  finishNow() { closeOverlay(); S.game.finished = true; saveGame(); S.celebrated = false; go('final'); },
  homeKeep() { closeOverlay(); releaseWake(); go('home'); },
  fullscreen() {
    const de = document.documentElement;
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else { const p = (de.requestFullscreen || de.webkitRequestFullscreen).call(de); p && p.catch && p.catch(() => {}); }
    } catch (e) {}
  },
  adjScore(el) { const t = S.game.teams[+el.dataset.i]; if (!t) return; t.score += +el.dataset.d; saveGame(); render(); },
  async pickCat(el) {
    if (S.rolling) return;
    const c = getCat(el.dataset.id);
    if (!c) return;
    if (!parseWords(c.words).length) { toast('이 주제에는 문제가 없어요. [문제 편집]에서 채워 주세요'); return; }
    if ((S.game.usedCats[c.id] || []).length && !(await ask(`'${catName(c)}' 주제는 이미 했어요. 그래도 할까요?`, '할래요', '아니요'))) return;
    S.pendingCat = c.id; go('ready');
  },
  randomCat() {
    if (S.rolling) return;
    const g = S.game;
    const all = playableCats().filter(c => parseWords(c.words).length);
    if (!all.length) { toast('뽑을 주제가 없어요'); return; }
    let pool = all.filter(c => !(g.usedCats[c.id] || []).length);
    if (!pool.length) pool = all;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    if (reduceMotion() || pool.length === 1) { S.pendingCat = pick.id; go('ready'); return; }
    const ids = pool.map(c => c.id), end = ids.indexOf(pick.id);
    const N = ids.length * (ids.length < 4 ? 4 : 2) + end + 1;
    S.rolling = true;
    let i = 0;
    const step = () => {
      if (S.screen !== 'board') { S.rolling = false; return; }
      $$('.cat.is-roll').forEach(t => t.classList.remove('is-roll'));
      const tile = $(`.cat[data-id="${ids[i % ids.length]}"]`);
      if (tile) tile.classList.add('is-roll');
      Sound.play('roll');
      i++;
      if (i < N) setTimeout(step, 50 + 260 * Math.pow(i / N, 3));
      else setTimeout(() => { S.rolling = false; if (S.screen === 'board') { S.pendingCat = pick.id; go('ready'); } }, 750);
    };
    step();
  },

  /* 차례 진행 */
  beginTurn() { beginCountdown(); },
  correct() {
    if (!canAct()) return;
    const tr = S.turn, cur = tr.current;
    snapshot();
    const e = tr.log.find(x => x.w === cur.w);
    if (e) e.r = 'ok'; else tr.log.push({ w: cur.w, h: cur.h, r: 'ok' });
    Sound.play('ok'); buzz(25); feedback('ok');
    advance();
  },
  pass() {
    const tr = S.turn;
    if (tr && tr.running && !tr.ended && tr.passesLeft === 0) { Sound.play('deny'); toast('패스를 다 썼어요'); return; }
    if (!canAct()) return;
    const cur = tr.current;
    snapshot();
    if (tr.passesLeft > 0) tr.passesLeft--;
    if (!tr.log.find(x => x.w === cur.w)) tr.log.push({ w: cur.w, h: cur.h, r: 'pass' });
    if (S.game.rules.passRequeue) tr.pool.push(cur);
    Sound.play('pass'); buzz(12); feedback('pass');
    advance();
  },
  undo() {
    const tr = S.turn;
    if (!tr || tr.ended || !tr.undo.length || overlayOpen()) return;
    const s = tr.undo.pop();
    tr.pool = s.pool; tr.current = s.current; tr.log = s.log; tr.passesLeft = s.passesLeft;
    updatePlay(true);
    toast('한 단계 되돌렸어요');
  },
  pause() {
    const tr = S.turn;
    if (!tr || tr.ended || !tr.running) return;
    stopClock();
    overlay(`<div class="modal" role="dialog" aria-modal="true" aria-label="잠깐 멈춤">
      <h3 class="modal-title">잠깐 멈췄어요</h3>
      <p class="modal-text">남은 시간 ${Math.ceil(tr.remaining / 1000)}초</p>
      <div class="modal-btns">
        <button class="btn btn-main" data-act="resumeTurn">계속하기</button>
        <button class="btn btn-sub" data-act="endTurnNow">이 차례 여기서 끝내기</button>
      </div></div>`);
  },
  resumeTurn() { closeOverlay(); startClock(); },
  endTurnNow() { closeOverlay(); endTurn('stop'); },

  /* 결과 */
  toggleWord(el) {
    const x = S.turn && S.turn.log[+el.dataset.i];
    if (!x) return;
    x.r = x.r === 'ok' ? (x.orig === 'ok' ? 'miss' : x.orig) : 'ok';
    render();
  },
  confirmTurn() {
    const g = S.game, tr = S.turn;
    if (!g || !tr) return;
    const ti = curTeamIdx(g), sc = calcTurnScore(tr);
    g.teams[ti].score += sc;
    (g.usedCats[tr.catId] || (g.usedCats[tr.catId] = [])).push(ti);
    g.history.push({ turn: g.turnIndex, team: ti, cat: tr.cat.name, score: sc, ok: tr.log.filter(x => x.r === 'ok').map(x => x.w) });
    g.turnIndex++;
    S.turn = null; S.pendingCat = null;
    if (g.turnIndex >= totalTurns(g)) { g.finished = true; saveGame(); S.celebrated = false; go('final'); }
    else { saveGame(); go('board'); }
  },
  rematch() {
    const g = S.game;
    if (!g) return;
    S.game = Object.assign(clone(g), { id: Date.now(), turnIndex: 0, usedCats: {}, history: [], finished: false });
    S.game.teams.forEach(t => { t.score = 0; });
    saveGame(); keepAwake(); go('board');
  },

  /* 편집 */
  addCat() {
    S.data.categories.push({ id: 'n' + Date.now().toString(36), emoji: '⭐', name: '새 주제', rule: '', points: 1, enabled: true, words: '' });
    dataChanged(); render();
    const panels = $$('.ed-cat'), last = panels[panels.length - 1];
    if (last) {
      last.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'center' });
      const nm = last.querySelector('.ed-name');
      if (nm) try { nm.focus({ preventScroll: true }); nm.select(); } catch (e) {}
    }
  },
  async delCat(el) {
    const i = +el.dataset.i, c = S.data.categories[i];
    if (!c) return;
    if (!(await ask(`'${catName(c)}' 주제를 지울까요? 안에 있는 문제도 같이 지워져요.`, '지우기', '그만두기'))) return;
    const y = window.scrollY;
    S.data.categories.splice(i, 1);
    dataChanged(); render(); window.scrollTo(0, y);
  },
  moveCat(el) {
    const i = +el.dataset.i, j = i + Number(el.dataset.d), a = S.data.categories;
    if (j < 0 || j >= a.length) return;
    [a[i], a[j]] = [a[j], a[i]];
    const y = window.scrollY;
    dataChanged(); render(); window.scrollTo(0, y);
  },
  async copyCode() {
    const code = generateCode();
    let ok = false;
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(code); ok = true; } } catch (e) {}
    if (!ok) {
      try {
        const ta = document.createElement('textarea');
        ta.value = code; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove();
      } catch (e) {}
    }
    overlay(`<div class="modal modal-wide" role="dialog" aria-modal="true" aria-label="깃허브용 코드">
      <h3 class="modal-title">${ok ? '코드를 복사했어요' : '아래 코드를 복사해 주세요'}</h3>
      <p class="modal-text small">깃허브에서 index.html을 열고, 맨 위의 <b>const DEFAULT_DATA = {</b> 부터 <b>문제 데이터 끝</b> 표시 바로 위까지를 지운 다음 붙여 넣으면 돼요.</p>
      <textarea class="code-box" readonly>${esc(code)}</textarea>
      <div class="modal-btns"><button class="btn btn-main" data-act="closeOv">닫기</button></div>
    </div>`);
  },
  exportFile() {
    const blob = new Blob([JSON.stringify({ app: 'speed-quiz', version: 1, data: S.data }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '스피드퀴즈-문제.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    toast('파일로 내보냈어요');
  },
  importFile() { const inp = $('#importInput'); if (inp) { inp.value = ''; inp.click(); } },
  async resetData() {
    if (!(await ask('이 기기에서 고친 내용을 지우고 처음 문제로 되돌릴까요?', '되돌리기', '그만두기'))) return;
    clearTimeout(saveTimer);
    store.del(KEY.data);
    S.data = normalizeData(BASE_DATA);
    S.saveMsg = '되돌렸어요';
    render(); window.scrollTo(0, 0);
  }
};

let saveTimer = null;
function dataChanged() {
  S.saveMsg = '저장 중…';
  const a = $('#saveState'); if (a) a.textContent = S.saveMsg;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const ok = store.set(KEY.data, S.data);
    S.saveMsg = ok ? '저장됨 ✓' : '저장 안 됨';
    const b = $('#saveState'); if (b) b.textContent = S.saveMsg;
    if (!ok) toast('이 브라우저에서는 저장이 안 돼요. [깃허브용 코드 복사]로 옮겨 주세요');
  }, 400);
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', e => {
  if (e.target.id === 'overlay' && $('#overlay .guide')) { closeOverlay(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  Sound.unlock();
  fn(el, e);
});

document.addEventListener('input', e => {
  const el = e.target, b = el.dataset && el.dataset.bind;
  if (!b) return;
  const i = +el.dataset.i, c = S.data.categories[i], t = S.settings.teams[i];
  switch (b) {
    case 'teamName': if (t) { t.name = el.value; saveSettings(); syncGameTeams(); } break;
    case 'teamMembers': if (t) { t.members = el.value; saveSettings(); syncGameTeams(); } break;
    case 'dataTitle': S.data.title = el.value; dataChanged(); break;
    case 'dataSubtitle': S.data.subtitle = el.value; dataChanged(); break;
    case 'catEmoji': if (c) { c.emoji = el.value; dataChanged(); } break;
    case 'catName': if (c) { c.name = el.value; dataChanged(); } break;
    case 'catRule': if (c) { c.rule = el.value; dataChanged(); } break;
    case 'catWords':
      if (c) {
        c.words = el.value; dataChanged();
        const k = $('#cnt-' + i); if (k) k.textContent = `문제 ${parseWords(c.words).length}개`;
      }
      break;
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'importInput') {
    const f = el.files && el.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const j = JSON.parse(rd.result), raw = j && j.data ? j.data : j;
        if (!raw || !Array.isArray(raw.categories)) throw new Error('형식이 달라요');
        S.data = normalizeData(raw);
        dataChanged(); render(); toast('문제를 불러왔어요');
      } catch (err) { toast('이 파일은 불러올 수 없어요'); }
    };
    rd.readAsText(f);
    return;
  }
  const b = el.dataset && el.dataset.bind;
  const c = b && S.data.categories[+el.dataset.i];
  if (!c) return;
  if (b === 'catPoints') { c.points = toInt(el.value, 1, 5, 1); dataChanged(); }
  if (b === 'catEnabled') { c.enabled = el.checked; const p = el.closest('.ed-cat'); if (p) p.classList.toggle('is-off', !c.enabled); dataChanged(); }
});

document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input, textarea, select')) return;
  if (overlayOpen()) {
    if (e.key !== 'Escape') return;
    if ($('[data-act="resumeTurn"]')) { e.preventDefault(); ACT.resumeTurn(); }
    else if ($('[data-act="askNo"]')) { e.preventDefault(); ACT.askNo(); }
    else if ($('[data-act="closeOv"]')) { e.preventDefault(); closeOverlay(); }
    return;
  }
  if (S.screen === 'play') {
    if ([' ', 'Enter', 'ArrowRight'].includes(e.key)) { e.preventDefault(); Sound.unlock(); ACT.correct(); }
    else if (['ArrowLeft', 'ArrowDown', 'p', 'P'].includes(e.key)) { e.preventDefault(); ACT.pass(); }
    else if (['Backspace', 'z', 'Z'].includes(e.key)) { e.preventDefault(); ACT.undo(); }
    else if (e.key === 'Escape') { e.preventDefault(); ACT.pause(); }
  } else if (S.screen === 'ready' && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault(); Sound.unlock(); ACT.beginTurn();
  }
});

document.addEventListener('pointerdown', () => Sound.unlock(), { passive: true });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (S.turn && S.turn.running) ACT.pause(); }
  else if (S.game && ['board', 'ready', 'play', 'result', 'final'].includes(S.screen)) keepAwake();
});
let resizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (S.screen === 'play') fitWord(); }, 80); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (S.screen === 'play') fitWord(); });
if (document.fonts && document.fonts.addEventListener) {
  document.fonts.addEventListener('loadingdone', () => { if (S.screen === 'play') requestAnimationFrame(fitWord); });
}

render();
})();
</script>
</body>
</html>
